# espanso matches (snippets)
# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:
  # Development
  - trigger: ";js"
    replace: "JavaScript"
  - trigger: ";ts"
    replace: "TypeScript"
  - trigger: ";as"
    replace: "AppleScript"
  - trigger: ";next"
    replace: "Next.js"
  - trigger: ";node"
    replace: "Node.js"
  - trigger: ";sb"
    replace: "Supabase"
  - trigger: ";ef"
    replace: "Edge Functions"
  - trigger: ";pg"
    replace: "PostgreSQL"
  - trigger: ";rmd"
    replace: "README.md"
  - trigger: ";cmd"
    replace: "CLAUDE.md"
  - trigger: ";amd"
    replace: "AGENTS.md"
  - trigger: ";gh"
    replace: "GitHub"
  - trigger: ";cf"
    replace: "Cloudflare"
  - trigger: ";cc"
    replace: "Claude Code"
  - trigger: ";hf"
    replace: "Hugging Face"
  - trigger: ";cui"
    replace: "ComfyUI"
  - trigger: ";sui"
    replace: "shadcn/ui"
  - trigger: ";gos"
    replace: "GrapheneOS"
  # Date
  - trigger: ";date"
    replace: "{{d}}"
    vars:
      - name: d
        type: date
        params:
          format: "%Y/%m/%d"
  - trigger: ";time"
    replace: "{{d}}"
    vars:
      - name: d
        type: date
        params:
          format: "%H:%M:%S"
  - trigger: ";now"
    replace: "{{d}}"
    vars:
      - name: d
        type: date
        params:
          format: "%Y/%m/%d %H:%M"
