macros:
  model-dir: "${env.HOME}/models"
  llama-server: >-
    ${env.HOME}/.local/bin/llama-server
    --port ${PORT}
    -ngl 99
    -fa on
    --parallel 1
    --ctx-size 131072
    --cache-type-k q8_0
    --cache-type-v q8_0
    --jinja
    --temp 0.6
    --top-p 0.95
    --top-k 20
    --min-p 0
    --presence-penalty 1.5
    --repeat-penalty 1.0

healthCheckTimeout: 600

models:
  "qwen3.8-27b-uncensored":
    name: "Qwen3.8-27B-Uncensored-Q4_K_M"
    cmd: >-
      ${llama-server}
      -m ${model-dir}/Qwen3.8-27B-Uncensored/Qwen3.8-27B-Uncensored-Q4_K_M.gguf
      --mmproj ${model-dir}/Qwen3.8-27B-Uncensored/Qwen3.8-27B-Uncensored-vision-f16.gguf
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --spec-draft-p-min 0.65
    env:
      - 'LLAMA_ARG_CHAT_TEMPLATE_KWARGS={"preserve_thinking": true, "reasoning_effort": "medium"}'
    ttl: 3600
