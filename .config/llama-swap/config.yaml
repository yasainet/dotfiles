macros:
  model-dir: "${env.HOME}/models"
  llama-server: >-
    /opt/homebrew/bin/llama-server
    --port ${PORT}
    -ngl 99
    -fa on
    --parallel 1
    --jinja
    --ctx-size 262144
    --temp 0.6
    --top-p 0.95
    --top-k 20
    --min-p 0
    --presence-penalty 1.5
    --repeat-penalty 1.0

healthCheckTimeout: 600

models:
  "qwen3.6-35b-a3b":
    name: "Qwen3.6-35B-A3B"
    cmd: >-
      ${llama-server}
      -m ${model-dir}/Qwen3.6-35B-A3B/Qwen3.6-35B-A3B-Q8_0.gguf
      --mmproj ${model-dir}/Qwen3.6-35B-A3B/mmproj-F16.gguf
    env:
      - 'LLAMA_ARG_CHAT_TEMPLATE_KWARGS={"preserve_thinking": true}'
    ttl: 1800

  "qwen3.6-35b-a3b-hauhau-aggressive":
    name: "Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive"
    cmd: >-
      ${llama-server}
      -m ${model-dir}/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-Q8_K_P.gguf
      --mmproj ${model-dir}/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive/mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf
    env:
      - 'LLAMA_ARG_CHAT_TEMPLATE_KWARGS={"preserve_thinking": true}'
    ttl: 1800

  "qwen3.6-27b-hauhau-balanced":
    name: "Qwen3.6-27B-Uncensored-HauhauCS-Balanced"
    cmd: >-
      ${llama-server}
      -m ${model-dir}/Qwen3.6-27B-Uncensored-HauhauCS-Balanced/Qwen3.6-27B-Uncensored-HauhauCS-Balanced-Q8_K_P.gguf
      --mmproj ${model-dir}/Qwen3.6-27B-Uncensored-HauhauCS-Balanced/mmproj-Qwen3.6-27B-Uncensored-HauhauCS-Balanced-f16.gguf
    env:
      - 'LLAMA_ARG_CHAT_TEMPLATE_KWARGS={"preserve_thinking": true}'
    ttl: 1800

  "qwen3.8-27b":
    name: "Qwen3.8-27B"
    cmd: >-
      ${llama-server}
      -m ${model-dir}/Qwen3.8-27B/BF16/Qwen3.8-27B-BF16-00001-of-00002.gguf
      --mmproj ${model-dir}/Qwen3.8-27B/mmproj-BF16.gguf
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --spec-draft-p-min 0.65
    env:
      - 'LLAMA_ARG_CHAT_TEMPLATE_KWARGS={"preserve_thinking": true}'
    ttl: 1800

  "qwen3.8-27b-uncensored":
    name: "Qwen3.8-27B-Uncensored"
    cmd: >-
      ${llama-server}
      -m ${model-dir}/Qwen3.8-27B-Uncensored/Qwen3.8-27B-Uncensored-Q8_0.gguf
      --mmproj ${model-dir}/Qwen3.8-27B-Uncensored/Qwen3.8-27B-Uncensored-vision-f16.gguf
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --spec-draft-p-min 0.65
    env:
      - 'LLAMA_ARG_CHAT_TEMPLATE_KWARGS={"preserve_thinking": true}'
    ttl: 1800
