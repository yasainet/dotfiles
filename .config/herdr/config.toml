onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
previous_agent = "prefix+,"
next_agent = "prefix+."

[ui]
accent = "cyan"
sidebar_collapsed_mode = "hidden"
agent_panel_sort = "spaces"
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = false
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true
pane_scrollbars = false
tab_bar_position = "bottom"

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
kitty_graphics = true
pane_history = true
switch_ascii_input_source_in_prefix = false
reveal_hidden_cursor_for_cjk_ime = false
cjk_ime_agents = ["claude", "opencode"]
cjk_ime_cursor_shape = "block"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+ctrl+h"
type = "popup"
command = "hunk diff"
description = "hunk"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+ctrl+r"
type = "popup"
command = "/Users/yasainet/.config/herdr/scripts/claude-resume.sh --send"
description = "claude resume"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+ctrl+f"
type = "popup"
command = "/Users/yasainet/.config/herdr/scripts/claude-mention.sh --send"
description = "claude @file"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+ctrl+_"
type = "popup"
command = "zsh"
description = "terminal"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+ctrl+y"
# HACK: popup doesn’t support Kitty graphics.
type = "pane"
command = "yazi"
description = "yazi"

[[keys.command]]
key = "prefix+ctrl+o"
# HACK: popup doesn’t support Kitty graphics.
type = "pane"
command = "nvim -c 'Octo issue list'"
description = "octo"

[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "yasainet.quote.quote-selection"
description = "quote selection into prompt"
