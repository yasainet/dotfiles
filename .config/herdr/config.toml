onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
navigate_workspace_down = "j"
navigate_workspace_up = "k"

[ui]
accent = "cyan"
sidebar_max_width = 20
sidebar_collapsed_mode = "hidden"
agent_panel_sort = "spaces"
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = false
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true
pane_scrollbars = false
tab_bar_position = "bottom"

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
kitty_graphics = true
pane_history = true
switch_ascii_input_source_in_prefix = false
reveal_hidden_cursor_for_cjk_ime = false
cjk_ime_agents = ["claude", "opencode"]
cjk_ime_cursor_shape = "block"

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "/Users/yasainet/.config/herdr/scripts/nvim-nav.sh h"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "/Users/yasainet/.config/herdr/scripts/nvim-nav.sh j"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "/Users/yasainet/.config/herdr/scripts/nvim-nav.sh k"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "/Users/yasainet/.config/herdr/scripts/nvim-nav.sh l"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+ctrl+h"
type = "popup"
command = "hunk diff"
description = "hunk"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+ctrl+shift+h"
type = "popup"
command = "/Users/yasainet/.config/herdr/scripts/hunk-session.sh"
description = "hunk (claude session)"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+ctrl+m"
type = "popup"
command = "git fetch -q origin main; hunk diff origin/main"
description = "hunk (vs origin/main)"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+ctrl+r"
type = "popup"
command = "/Users/yasainet/.config/herdr/scripts/claude-resume.sh --send"
description = "claude resume"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+ctrl+f"
type = "popup"
command = "/Users/yasainet/.config/herdr/scripts/claude-mention.sh --send"
description = "claude @file"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+ctrl+/"
type = "popup"
command = "zsh"
description = "terminal"
width = "100%"
height = "100%"

[[keys.command]]
key = "prefix+ctrl+y"
# HACK: popup は Kitty graphics を描画せず yazi の画像プレビューが出ないため、
# 一時 pane で代用する。popup が対応したら type = "popup" に戻す
type = "pane"
command = "yazi"
description = "yazi"

[[keys.command]]
key = "prefix+ctrl+v"
type = "pane"
command = "nvim"
description = "nvim"

[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "yasainet.quote.quote-selection"
description = "quote selection into prompt"
