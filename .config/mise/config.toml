[tools]
ruby = "3.3.6"

# ====================
# macOS defaults
# ====================
# Apply:  mise bootstrap --only macos-defaults
# Drift:  mise bootstrap macos defaults status --missing

[bootstrap.macos.defaults.NSGlobalDomain]
# Trackpad: カーソル移動速度 (最大 3.0)
"com.apple.trackpad.scaling" = 3.0
# Mouse: マウスカーソル移動速度 (最大 3.0)
"com.apple.mouse.scaling" = 3.0
# Mouse: スクロールホイール速度
"com.apple.scrollwheel.scaling" = 1.0
# Mouse: ナチュラルスクロール ON
"com.apple.swipescrolldirection" = true
# Appearance: ダークモード固定
AppleInterfaceStyle = "Dark"
# Keyboard: キーリピート速度
KeyRepeat = 2
# Keyboard: リピート開始までの遅延
InitialKeyRepeat = 15
# Keyboard: 長押しアクセント入力を無効化しキーリピートを優先
ApplePressAndHoldEnabled = false
# Keyboard: スペルの自動修正 OFF
NSAutomaticSpellingCorrectionEnabled = false
# Keyboard: 単語の自動大文字化 OFF
NSAutomaticCapitalizationEnabled = false
# Window: タイトルバーダブルクリックでウィンドウを画面いっぱいに広げる
AppleActionOnDoubleClick = "Fill"
# Finder: 全ての拡張子を表示
AppleShowAllExtensions = true

# Trackpad (内蔵)
[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
# 三本指ドラッグ
TrackpadThreeFingerDrag = true
# タップでクリック
Clicking = true
# トラックパッドでのドラッグ (Accessibility)
Dragging = true
# ドラッグスタイル Without Drag Lock (ドラッグロック無効)
DragLock = false
# 右端 2 本指スワイプで通知センターを開くジェスチャー OFF
TrackpadTwoFingerFromRightEdgeSwipeGesture = 0

# Trackpad (Bluetooth): 内蔵と同じ
[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
TrackpadThreeFingerDrag = true
Clicking = true
Dragging = true
DragLock = false
TrackpadTwoFingerFromRightEdgeSwipeGesture = 0

[bootstrap.macos.dock]
# 常駐アプリ
apps = ["/System/Applications/Siri AI.app"]

[bootstrap.macos.defaults."com.apple.dock"]
# アイコンサイズ 最小 (16px)
tilesize = 16
# マウスオーバー時の拡大 OFF
magnification = false
# 自動非表示 ON
autohide = true
# 位置 右
orientation = "right"
# 最近使ったアプリ OFF
"show-recents" = false
# ホットコーナー: 全て無効、修飾キー無し
"wvous-tl-corner" = 0
"wvous-tl-modifier" = 0
"wvous-tr-corner" = 0
"wvous-tr-modifier" = 0
"wvous-bl-corner" = 0
"wvous-bl-modifier" = 0
"wvous-br-corner" = 0
"wvous-br-modifier" = 0

[bootstrap.macos.defaults."com.apple.finder"]
# 隠しファイルを表示
AppleShowAllFiles = true
# パスバーを表示
ShowPathbar = true
# ステータスバーを表示
ShowStatusBar = true
# Cmd+Q で Finder を終了できるようにする (終了中は Cmd+Tab にも現れない)
QuitMenuItem = true

# Symbolic hotkeys
# Notification Center
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["163"]
value = { enabled = true, value = { parameters = [
  65535,
  53,
  1048576,
], type = "standard" } }

# Screenshot
#   28: 画面全体 → ファイル (Cmd+Shift+3)
#   29: 画面全体 → クリップボード (Ctrl+Cmd+Shift+3)
#   30: 範囲選択 → ファイル (Cmd+Shift+4)
#   31: 範囲選択 → クリップボード (Ctrl+Cmd+Shift+4)
#  184: 撮影・録画オプション (Cmd+Shift+5)
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["28"]
value = { enabled = false }

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["29"]
value = { enabled = false }

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["30"]
value = { enabled = false }

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["31"]
value = { enabled = false }

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["184"]
value = { enabled = false }

# Input Source
#   60: Select previous input source (Ctrl+Space)
#   61: Select next input source (Ctrl+Opt+Space)
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["60"]
value = { enabled = false, value = { parameters = [
  32,
  49,
  262144,
], type = "standard" } }

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["61"]
value = { enabled = false, value = { parameters = [
  32,
  49,
  786432,
], type = "standard" } }

