# Darkbloom provider config
config_version = 3

[backend]
enabled_models = [
  "gpt-oss-20b",
  "qwen3.6-35b-a3b-vl-mtp-mxfp8",
  "qwen3.5-35b-a3b",
  "qwen3-vl-30b-a3b-instruct",
  "gemma-4-26b",
  "gemma-4-26b-qat-4bit",
  "sentence-transformers/all-MiniLM-L6-v2",
]
engine_v2_kv_backend = 'auto'
engine_v2_max_concurrent = 4
idle_timeout_mins = 60
max_model_slots = 3
mtp_mode = 'auto'
port = 8100
preload_models = []
startup_preload = true
startup_preload_timeout_secs = 120
startup_selftest = true
startup_selftest_fail_closed = false

[backend.engine_v2_kv_backend_by_model]

[backend.engine_v2_max_concurrent_by_model]

[coordinator]
heartbeat_interval_secs = 5
private_only = false
url = 'wss://api.darkbloom.dev/ws/provider'

[gemma_optimizations]
prefill_layer18 = true
weighted_r1 = true

[provider]
auto_restart = true
auto_update = true
memory_reserve_gb = 4
name = 'darkbloom-mac15-8'
update_jitter_seconds = 300
