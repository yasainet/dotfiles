gui:
  sidePanelWidth: 0.25
  scrollPastBottom: false
  showCommandLog: false
  showRandomTip: false
  nerdFontsVersion: "3"
  theme:
    selectedLineBgColor:
      - "#292e42"
git:
  diffRenderers:
    - name: hunk
      colorArg: always
      command: hunk pager --mode split
    - name: default
      colorArg: always
      type: rawGit
os:
  editPreset: "nvim"
keybinding:
  files:
    commitChanges: "<disabled>"
customCommands:
  - key: "c"
    context: "files"
    description: "AI commit (stage all + generate message)"
    command: sh -c "~/.config/lazygit/ai-commit-msg.sh"
    output: terminal
