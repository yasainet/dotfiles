gui:
  sidePanelWidth: 0.25
  scrollPastBottom: false
  showCommandLog: false
  showRandomTip: false
  nerdFontsVersion: "3"
  theme:
    selectedLineBgColor:
      - "#292e42"
  #   activeBorderColor:
  #     - "#ff9e64"
  #     - "bold"
  #   inactiveBorderColor:
  #     - "#27a1b9"
  #   searchingActiveBorderColor:
  #     - "#ff9e64"
  #     - "bold"
  #   optionsTextColor:
  #     - "#7aa2f7"
  #   cherryPickedCommitFgColor:
  #     - "#7aa2f7"
  #   cherryPickedCommitBgColor:
  #     - "#bb9af7"
  #   markedBaseCommitFgColor:
  #     - "#7aa2f7"
  #   markedBaseCommitBgColor:
  #     - "#e0af68"
  #   unstagedChangesColor:
  #     - "#db4b4b"
  #   defaultFgColor:
  #     - "#c0caf5"
git:
  # hunk は diff だけを描画し、commit header と message を落とす
  # commit message を読むときは `|` で default に切り替える (`\` で逆順)
  pagers:
    - name: hunk
      colorArg: always
      pager: hunk pager --mode split
    - name: default
      colorArg: always
      pager: ""
os:
  editPreset: "nvim"
keybinding:
  files:
    commitChanges: "<disabled>"
customCommands:
  - key: "c"
    context: "files"
    description: "AI commit (stage all + generate message)"
    command: sh -c "~/.config/lazygit/ai-commit-msg.sh"
    output: terminal
